name: 全量回填（拆包所有历史版本）

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  backfill:
    name: 回填所有版本的拆包数据
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 全量拆包（客户端 + 服务端 + 文本内容）
        env:
          TRACK_RELEASES: "99999"
          TRACK_SNAPSHOTS: "99999"
          CONTENTS_ALL: "1"      # 所有版本都提取文本内容
          FORCE_CONTENTS: "1"    # 已拆包但缺内容的版本也补上
        run: python scripts/fetch_versions.py

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "无数据变更"
          else
            git commit -m "feat: 全量回填所有版本的拆包数据（客户端/服务端/文本内容）"
            # 远端可能有新提交（如运行期间的文档更新），rebase 后重试推送
            for i in 1 2 3; do
              if git push; then break; fi
              echo "push 失败，拉取远端更新后重试（第 $i 次）"
              git fetch origin
              git rebase origin/main || { git rebase --abort; exit 1; }
              sleep 5
            done
          fi

      - name: 组装站点文件
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/data

      - name: 上传 Pages 静态站点
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: 部署 GitHub Pages
    needs: backfill
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 开通/配置 Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v5
